# Sync read-only de snapshots JSON de produção (SCP) para runtime/export/.
# Uso: docker compose -f docker-compose.sync.yml run --rm warden-sync-prod
# Ou: .\scripts\sync-prod-snapshots.ps1

services:
  warden-sync-prod:
    build:
      context: .
      dockerfile: Dockerfile.sync
    env_file:
      - secrets/production.deploy.local.env
    environment:
      WARDEN_SYNC_MODE: scp
    volumes:
      - ./runtime/export:/app/runtime/export
      - ./secrets/.ssh:/app/secrets/.ssh:ro
