# Ambiente local: UI/API Warden (Nginx + PHP-FPM), estilo MAIATRON-HUB.
# Uso: docker compose -f docker-compose.dev.yml up --build
# UI: http://127.0.0.1:8080/MAIATRON/apps/warden/

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    environment:
      WARDEN_SOURCE_PATH: /warden-exports/warden_payload.json
      WARDEN_FAST_SOURCE_PATH: /warden-exports/warden_fast_snapshot.json
      WARDEN_HEAVY_SOURCE_PATH: /warden-exports/warden_heavy_snapshot.json
    volumes:
      - ./runtime/export:/warden-exports:ro

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      - php
    ports:
      - "8080:80"
