# WELLS-GENERATED: dependabot
# Regenerar: node .agents/tools/wells-toolkit.mjs github --project . --apply
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      github-actions-routine:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
