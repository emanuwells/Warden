# Ambiente local genérico: UI/API Warden (Nginx + PHP-FPM), sem login.
# Uso: docker compose -f docker/compose.dev.yml up --build
# UI: http://127.0.0.1:8080/

name: warden

services:
  php:
    build:
      context: ..
      dockerfile: docker/Dockerfile.php
    environment:
      WARDEN_DEV_SKIP_AUTH: "1"
      WARDEN_VERSION: ${WARDEN_VERSION:-2.1.0}
      WARDEN_SOURCE_PATH: /warden-exports/warden_payload.json
      WARDEN_FAST_SOURCE_PATH: /warden-exports/warden_fast_snapshot.json
      WARDEN_HEAVY_SOURCE_PATH: /warden-exports/warden_heavy_snapshot.json
    volumes:
      - type: bind
        source: ${WARDEN_EXPORT_DIR:-../runtime/export}
        target: /warden-exports
        read_only: true

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      - php
    ports:
      - "${WARDEN_DEV_PORT:-8080}:80"
