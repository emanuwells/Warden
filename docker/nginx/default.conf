server {
    listen 80;
    server_name _;

    root /var/www/html/www;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/www/api.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/www;
        fastcgi_pass php:9000;
    }

    location ~ \.php$ {
        return 404;
    }
}
