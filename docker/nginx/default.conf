server {
    listen 80;
    server_name _;

    root /var/www/html/frontend;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /MAIATRON {
        return 301 /MAIATRON/;
    }

    location /MAIATRON/ {
        alias /var/www/html/frontend/;
        try_files $uri $uri/ =404;
    }

    location ~ ^/MAIATRON/apps/([^/]+)/api\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/apps/$1/api.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/frontend;
        fastcgi_pass php:9000;
    }

    location ~ \.php$ {
        return 404;
    }
}
