# WELLS-GENERATED: release-check
name: Release Gate

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          test -f VERSION
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          TAG_VALUE="${GITHUB_REF_NAME#v}"
          [[ "$VERSION_VALUE" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          test "$TAG_VALUE" = "$VERSION_VALUE"
      - name: Setup Node.js for WELLS validation
        if: hashFiles('.agents/manifest.json') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate WELLS runtime
        if: hashFiles('.agents/manifest.json') != ''
        run: node .agents/tools/validate-project.mjs
